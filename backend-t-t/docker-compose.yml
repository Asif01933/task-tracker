
version: '3.8'

services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: task-tracker-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      - tasknet
    # Use the 'laravel' user
    user: laravel

  nginx:
    image: nginx:stable-alpine
    container_name: task-tracker-nginx
    restart: unless-stopped
    ports:
      - "8003:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - vite
    networks:
      - tasknet

  db:
    image: mysql:8.0
    container_name: task-tracker-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: task_tracker
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    command: [
      "--default-authentication-plugin=mysql_native_password",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci"
    ]
    ports:
      - "3310:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - tasknet

  # New dedicated service for Node.js and Vite
  vite:
    image: node:20-alpine
    container_name: task-tracker-vite
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "5173:5173"
    networks:
      - tasknet
    user: node
    command: sh -c "npm install && npm run dev"

  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: task-tracker-queue
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "php artisan queue:work --queue=default,emails --sleep=3 --tries=3 --timeout=120"
    volumes:
      - ./:/var/www
    depends_on:
      - app
      - db
    networks:
      - tasknet
    user: laravel

  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: task-tracker-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www
    depends_on:
      - app
      - db
    networks:
      - tasknet
    user: laravel

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - tasknet

volumes:
  db_data:

networks:
  tasknet:
    driver: bridge